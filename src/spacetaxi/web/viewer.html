<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacetaxi replay</title>
<style>
@font-face {
  font-family: "Press Start 2P";
  src: url(data:font/ttf;base64,/*FONT*/) format("truetype");
}
:root {
  --bg: #04030b;
  --panel: #0e0c1c;
  --line: #2a2546;
  --fg: #e9e6ff;
  --muted: #9a94c4;
  --accent: #ffd23f;
  --font: "Press Start 2P", "Courier New", monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); }
/* fixed, not absolute: a 1920 px wide stage would widen a phone's layout viewport */
#stage {
  position: fixed; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; background: var(--bg); font-family: var(--font);
}
#stage canvas { position: absolute; left: 0; top: 0; display: block; }
/* The retro screen: CRT scanlines and a vignette, key C turns them off and on. */
#crt {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%);
}
#crt[hidden] { display: none; }
#bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box;
  display: flex; gap: 14px; align-items: center; padding: 0 24px;
  background: linear-gradient(#07050f, #120d2e); border-top: 2px solid #7a5cff;
}
#bar button, #bar select {
  font: 16px var(--font); color: var(--fg); background: transparent;
  border: 2px solid var(--line); padding: 10px 14px; cursor: pointer;
}
#bar select { background: var(--panel); }
#bar button[aria-pressed="true"] { background: var(--accent); color: #120f00; border-color: var(--accent); }
#bar button:focus-visible, #bar select:focus-visible, #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#play { min-width: 130px; }
/* The INSERT COIN splash: browsers allow audio only after a click, so the round waits for one. */
#splash {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
  background: radial-gradient(ellipse at center, rgba(18,13,46,.88) 0%, rgba(4,3,11,.96) 70%);
  border: 0; padding: 0; margin: 0; cursor: pointer; font-family: var(--font); color: var(--fg);
}
#splash[hidden] { display: none; }
#splash .title {
  font-size: 72px; color: #2ef2ff; letter-spacing: 6px;
  text-shadow: 0 0 12px #2ef2ff, 0 0 32px #7a5cff;
}
#splash .coin {
  font-size: 40px; color: #ffd23f; text-shadow: 0 0 10px #ffd23f, 0 0 26px #ff8a3d;
  animation: blink 1.1s steps(2, start) infinite;
}
#splash .hint { font-size: 18px; color: var(--muted); }
#splash:focus-visible { outline: 2px solid var(--accent); outline-offset: -8px; }
@keyframes blink { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { #splash .coin { animation: none; } }
#scrub { flex: 1; accent-color: #7a5cff; height: 24px; }
/* Live mode (`spacetaxi serve`'s /watch): no playback controls, a leaderboard beside the arena. */
body.live #play, body.live [data-speed], body.live #scrub { display: none; }
body.live #bar { justify-content: flex-end; }
#splash .queue { font-size: 28px; color: #7dff5a; text-shadow: 0 0 10px #7dff5a; }
#splash .queue:empty { display: none; }
#splash .nextmap { font-size: 28px; color: #2ef2ff; text-shadow: 0 0 10px #2ef2ff; }
#splash .nextmap:empty { display: none; }
/* The plan of the next wave on the splash: one column per arena, then the waitlist. */
#splash .plan { display: flex; flex-direction: column; align-items: center; gap: 22px; }
#splash .plan:empty { display: none; }
#splash .plan .head { font-size: 28px; color: #ffd23f; text-shadow: 0 0 10px #ffd23f; }
#splash .plan .cols { display: flex; gap: 56px; align-items: flex-start; }
#splash .plan .col { display: flex; flex-direction: column; gap: 10px; min-width: 260px; text-align: left; }
#splash .plan .col b { font-weight: normal; font-size: 18px; color: #ff3df0; text-shadow: 0 0 8px #ff3df0; }
#splash .plan .col span { font-size: 20px; color: #2ef2ff; }
#splash .plan .wait { font-size: 16px; color: var(--muted); max-width: 1500px; line-height: 1.6; }
#lb {
  position: absolute; right: 0; top: 120px; bottom: 72px; width: 420px; box-sizing: border-box;
  padding: 28px 24px; background: rgba(7,5,15,.78); border-left: 2px solid #7a5cff;
  font-family: var(--font); overflow: hidden; display: flex; flex-direction: column;
}
#lb[hidden] { display: none; }
#lb h2 { margin: 0 0 8px; font-size: 22px; font-weight: normal; color: #ffd23f; text-shadow: 0 0 10px #ffd23f; }
#lb .sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
#lb ol { list-style: none; margin: 0; padding: 0; flex: 1 1 auto; min-height: 0; overflow: hidden; }
/* every name shows: with many rows, viewer.js shrinks --fs and --pad until they all fit */
#lb li { display: flex; gap: 12px; font-size: var(--fs, 16px); line-height: 1; padding: var(--pad, 11px) 0; border-bottom: 1px solid var(--line); }
/* The compact plan of the next wave under the leaderboard: one line per arena, one for the waitlist. */
#lbNext { flex: none; margin-top: 14px; padding-top: 12px; border-top: 2px solid #7a5cff; font-size: 11px; line-height: 1.5; }
#lbNext:empty { display: none; }
#lbNext div { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; color: #2ef2ff; }
#lbNext .head { color: #ffd23f; margin-bottom: 4px; }
#lbNext .wait { color: var(--muted); }
#lb li.empty { color: var(--muted); font-size: 12px; line-height: 1.6; border-bottom: none; }
#lb li .rank { color: var(--muted); min-width: 36px; }
#lb li .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #2ef2ff; }
#lb li .avg { color: #ffffff; font-variant-numeric: tabular-nums; }
#lb li:first-child .name { color: #ffd23f; }
#lb li .tag, #lb li .human, #lb li .house { font-size: min(10px, var(--fs, 16px)); align-self: center; color: #04030b; background: #ffffff; padding: 0.3em 4px; }
/* Milestone pop-ups on /watch, at the top of the arena, above the splash. */
#toasts {
  position: absolute; left: 0; width: 1500px; top: 140px; z-index: 6; pointer-events: none;
  display: flex; flex-direction: column; align-items: center; gap: 14px;
}
#toasts .toast {
  font-size: 30px; color: #7dff5a; background: rgba(4,3,11,.9); border: 3px solid #7dff5a;
  padding: 16px 26px; text-shadow: 0 0 10px #7dff5a; box-shadow: 0 0 22px rgba(125,255,90,.45);
  animation: pop 4.5s ease-out forwards;
}
#toasts .toast.first { color: #ffd23f; border-color: #ffd23f; text-shadow: 0 0 10px #ffd23f; box-shadow: 0 0 26px rgba(255,210,63,.55); }
@keyframes pop {
  0% { transform: scale(.4); opacity: 0; } 8% { transform: scale(1.08); opacity: 1; }
  14% { transform: scale(1); } 85% { opacity: 1; } 100% { opacity: 0; }
}
@media (prefers-reduced-motion: reduce) { #toasts .toast { animation: none; } }
/* Fly mode (`spacetaxi serve`'s /fly): a person flies one taxi. The join form, the queue, the
   results, the leave button and the touch controls sit outside the scaled stage, so they keep
   their size on a phone. */
body.fly #play, body.fly [data-speed], body.fly #scrub, body.fly #round { display: none; }
body.fly #bar { justify-content: flex-end; }
.fly-ui { font-family: var(--font); color: var(--fg); }
#join {
  position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; gap: 22px;
  align-items: center; justify-content: center; padding: 16px; text-align: center;
  background: radial-gradient(ellipse at center, rgba(18,13,46,.9) 0%, rgba(4,3,11,.97) 70%);
}
#join[hidden], #status[hidden], #results[hidden], #leave[hidden], #touch[hidden] { display: none; }
#join h1 { margin: 0; font-size: clamp(24px, 6vw, 64px); font-weight: normal; color: #2ef2ff;
           letter-spacing: 4px; text-shadow: 0 0 12px #2ef2ff, 0 0 32px #7a5cff; }
#join label { font-size: clamp(11px, 1.6vw, 16px); color: var(--muted); }
#join input, #join button, #leave, #touch button {
  font: clamp(14px, 2.2vw, 22px) var(--font); color: var(--fg); background: var(--panel);
  border: 2px solid #7a5cff; padding: 12px 16px;
}
#join input { width: 14ch; text-align: center; text-transform: none; }
#join button { color: #120f00; background: var(--accent); border-color: var(--accent); cursor: pointer; }
#join .hint, #join .msg { font-size: clamp(10px, 1.4vw, 14px); color: var(--muted); line-height: 1.8; }
#join .msg { color: #ff5a6e; min-height: 1em; }
#join input:focus-visible, #join button:focus-visible, #leave:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#status {
  position: fixed; left: 50%; top: 12%; transform: translateX(-50%); z-index: 6;
  font-size: clamp(11px, 1.8vw, 22px); color: #7dff5a; text-shadow: 0 0 10px #7dff5a;
  background: rgba(4,3,11,.85); border: 2px solid #7dff5a; padding: 12px 18px; text-align: center;
  line-height: 1.8; max-width: 92vw;
}
#results {
  position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
  background: rgba(4,3,11,.92); border: 2px solid #ffd23f; padding: 20px 26px; max-width: 92vw;
  font-size: clamp(10px, 1.5vw, 18px);
}
#results h2 { margin: 0 0 16px; font-size: clamp(16px, 2.6vw, 32px); font-weight: normal; color: #ffd23f;
              text-shadow: 0 0 12px #ffd23f; text-align: center; }
#results table { border-collapse: collapse; }
#results th { color: var(--muted); font-weight: normal; }
#results th, #results td { padding: 8px 10px; text-align: right; white-space: nowrap; }
#results td:nth-child(-n+2), #results th:nth-child(-n+2) { text-align: left; }
#results tr.you td { color: #2ef2ff; }
#leave { position: fixed; left: 50%; transform: translateX(-50%); bottom: max(12px, env(safe-area-inset-bottom, 0px)); z-index: 7; cursor: pointer; font-size: clamp(10px, 1.4vw, 16px); }
#touch {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: flex; justify-content: space-between;
  padding: 0 max(12px, env(safe-area-inset-left, 0px)) max(12px, env(safe-area-inset-bottom, 0px));
  pointer-events: none;
}
#touch .side { display: flex; gap: 12px; }
#touch button {
  pointer-events: auto; font-size: 28px; width: 76px; height: 76px; padding: 0; opacity: .8;
  user-select: none; -webkit-user-select: none; touch-action: none;
}
#touch button.on { background: #7a5cff; }
@media (hover: hover) and (pointer: fine) { #touch { display: none; } }
#tickLabel { font-size: 16px; color: var(--muted); min-width: 250px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
<body data-mode="/*MODE*/">
<div id="stage">
  <canvas id="board" width="1920" height="1080" aria-label="Replay of a spacetaxi round"></canvas>
  <div id="crt" title="key C"></div>
  <button id="splash" aria-label="Insert coin: click to start">
    <span class="title">SPACETAXI</span>
    <span class="coin">INSERT COIN &mdash; CLICK TO START</span>
    <span class="queue" id="queue"></span>
    <span class="nextmap" id="nextMap"></span>
    <span class="plan" id="plan"></span>
    <span class="hint">SPACE PLAY/PAUSE &middot; 1-4 SPEED &middot; C SCREEN &middot; M OR SOUND BUTTON MUTE &middot; D DEBUG</span>
  </button>
  <div id="toasts" aria-live="polite"></div>
  <aside id="lb" hidden aria-label="Leaderboard">
    <h2>LEADERBOARD</h2>
    <div class="sub" id="lbSub">AVG $ PER ROUND</div>
    <ol id="lbRows"></ol>
    <div id="lbNext"></div>
  </aside>
  <div id="bar" role="group" aria-label="Playback">
    <button id="play" title="play / pause (space)">PLAY</button>
    <button data-speed="0.5" title="key 1">0.5&times;</button>
    <button data-speed="1" title="key 2">1&times;</button>
    <button data-speed="2" title="key 3">2&times;</button>
    <button data-speed="4" title="key 4">4&times;</button>
    <button id="sound" title="sound on / off (key M)" aria-pressed="true">SOUND ON</button>
    <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Tick">
    <select id="round" aria-label="Round or arena"></select>
    <span id="tickLabel">TICK 0</span>
  </div>
</div>
<form id="join" class="fly-ui" hidden>
  <h1>SPACETAXI</h1>
  <label for="name">YOUR NAME (1-12 OF A-Z 0-9 _ -)</label>
  <input id="name" name="name" maxlength="12" autocomplete="nickname" autocapitalize="off" spellcheck="false" required>
  <button type="submit" id="fly">FLY</button>
  <p class="msg" id="joinMsg" role="alert"></p>
  <p class="hint">&uarr; MAIN ENGINE &middot; &larr; &rarr; SIDE JETS<br>LAND SOFTLY: KEEP VY AND VX IN THE GREEN</p>
</form>
<div id="status" class="fly-ui" role="status" aria-live="polite" hidden></div>
<div id="results" class="fly-ui" hidden><h2>ROUND OVER</h2><table><thead><tr>
  <th>#</th><th>NAME</th><th>$</th><th>DELIV</th><th>CRASH</th></tr></thead><tbody id="resultRows"></tbody></table></div>
<button id="leave" class="fly-ui" hidden>LEAVE</button>
<div id="touch" class="fly-ui" aria-label="Touch controls" hidden>
  <div class="side">
    <button data-key="ArrowLeft" aria-label="Left jet">&#9664;</button>
    <button data-key="ArrowRight" aria-label="Right jet">&#9654;</button>
  </div>
  <div class="side"><button data-key="ArrowUp" aria-label="Main engine">&#9650;</button></div>
</div>
<script id="replay" type="application/json">/*DATA*/</script>
<script>
/*SCRIPT*/
</script>
</body>
</html>
