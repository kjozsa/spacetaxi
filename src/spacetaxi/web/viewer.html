<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spacetaxi replay</title>
<style>
@font-face {
  font-family: "Press Start 2P";
  src: url(data:font/ttf;base64,/*FONT*/) format("truetype");
}
:root {
  --bg: #04030b;
  --panel: #0e0c1c;
  --line: #2a2546;
  --fg: #e9e6ff;
  --muted: #9a94c4;
  --accent: #ffd23f;
  --font: "Press Start 2P", "Courier New", monospace;
  color-scheme: dark;
}
html, body { margin: 0; height: 100%; overflow: hidden; background: #000; color: var(--fg); }
#stage {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px;
  transform-origin: 0 0; background: var(--bg); font-family: var(--font);
}
#stage canvas { position: absolute; left: 0; top: 0; display: block; }
/* The retro screen: CRT scanlines and a vignette, key C turns them off and on. */
#crt {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; pointer-events: none;
  background:
    repeating-linear-gradient(to bottom, rgba(0,0,0,0) 0 2px, rgba(0,0,0,.28) 2px 3px),
    radial-gradient(ellipse at center, rgba(0,0,0,0) 60%, rgba(0,0,0,.55) 100%);
}
#crt[hidden] { display: none; }
#bar {
  position: absolute; left: 0; right: 0; bottom: 0; height: 72px; box-sizing: border-box;
  display: flex; gap: 14px; align-items: center; padding: 0 24px;
  background: linear-gradient(#07050f, #120d2e); border-top: 2px solid #7a5cff;
}
#bar button, #bar select {
  font: 16px var(--font); color: var(--fg); background: transparent;
  border: 2px solid var(--line); padding: 10px 14px; cursor: pointer;
}
#bar select { background: var(--panel); }
#bar button[aria-pressed="true"] { background: var(--accent); color: #120f00; border-color: var(--accent); }
#bar button:focus-visible, #bar select:focus-visible, #scrub:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#play { min-width: 130px; }
/* The INSERT COIN splash: browsers allow audio only after a click, so the round waits for one. */
#splash {
  position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; z-index: 5;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 48px;
  background: radial-gradient(ellipse at center, rgba(18,13,46,.88) 0%, rgba(4,3,11,.96) 70%);
  border: 0; padding: 0; margin: 0; cursor: pointer; font-family: var(--font); color: var(--fg);
}
#splash[hidden] { display: none; }
#splash .title {
  font-size: 72px; color: #2ef2ff; letter-spacing: 6px;
  text-shadow: 0 0 12px #2ef2ff, 0 0 32px #7a5cff;
}
#splash .coin {
  font-size: 40px; color: #ffd23f; text-shadow: 0 0 10px #ffd23f, 0 0 26px #ff8a3d;
  animation: blink 1.1s steps(2, start) infinite;
}
#splash .hint { font-size: 18px; color: var(--muted); }
#splash:focus-visible { outline: 2px solid var(--accent); outline-offset: -8px; }
@keyframes blink { to { opacity: .25; } }
@media (prefers-reduced-motion: reduce) { #splash .coin { animation: none; } }
#scrub { flex: 1; accent-color: #7a5cff; height: 24px; }
/* Live mode (`spacetaxi serve`'s /watch): no playback controls, a leaderboard beside the arena. */
body.live #play, body.live [data-speed], body.live #scrub { display: none; }
body.live #bar { justify-content: flex-end; }
#splash .queue { font-size: 28px; color: #7dff5a; text-shadow: 0 0 10px #7dff5a; }
#splash .queue:empty { display: none; }
#lb {
  position: absolute; right: 0; top: 120px; bottom: 72px; width: 420px; box-sizing: border-box;
  padding: 28px 24px; background: rgba(7,5,15,.78); border-left: 2px solid #7a5cff;
  font-family: var(--font); overflow: hidden;
}
#lb[hidden] { display: none; }
#lb h2 { margin: 0 0 8px; font-size: 22px; font-weight: normal; color: #ffd23f; text-shadow: 0 0 10px #ffd23f; }
#lb .sub { font-size: 12px; color: var(--muted); margin-bottom: 24px; }
#lb ol { list-style: none; margin: 0; padding: 0; }
#lb li { display: flex; gap: 12px; font-size: 16px; line-height: 1; padding: 11px 0; border-bottom: 1px solid var(--line); }
#lb li .rank { color: var(--muted); min-width: 36px; }
#lb li .name { flex: 1; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; color: #2ef2ff; }
#lb li .avg { color: #ffffff; font-variant-numeric: tabular-nums; }
#lb li:first-child .name { color: #ffd23f; }
#tickLabel { font-size: 16px; color: var(--muted); min-width: 250px; text-align: right; font-variant-numeric: tabular-nums; }
</style>
<body data-mode="/*MODE*/">
<div id="stage">
  <canvas id="board" width="1920" height="1080" aria-label="Replay of a spacetaxi round"></canvas>
  <div id="crt" title="key C"></div>
  <button id="splash" aria-label="Insert coin: click to start">
    <span class="title">SPACETAXI</span>
    <span class="coin">INSERT COIN &mdash; CLICK TO START</span>
    <span class="queue" id="queue"></span>
    <span class="hint">SPACE PLAY/PAUSE &middot; 1-4 SPEED &middot; C SCREEN &middot; M OR SOUND BUTTON MUTE &middot; D DEBUG</span>
  </button>
  <aside id="lb" hidden aria-label="Leaderboard">
    <h2>LEADERBOARD</h2>
    <div class="sub" id="lbSub">AVG $ PER ROUND</div>
    <ol id="lbRows"></ol>
  </aside>
  <div id="bar" role="group" aria-label="Playback">
    <button id="play" title="play / pause (space)">PLAY</button>
    <button data-speed="0.5" title="key 1">0.5&times;</button>
    <button data-speed="1" title="key 2">1&times;</button>
    <button data-speed="2" title="key 3">2&times;</button>
    <button data-speed="4" title="key 4">4&times;</button>
    <button id="sound" title="sound on / off (key M)" aria-pressed="true">SOUND ON</button>
    <input id="scrub" type="range" min="0" max="0" step="1" value="0" aria-label="Tick">
    <select id="round" aria-label="Round or arena"></select>
    <span id="tickLabel">TICK 0</span>
  </div>
</div>
<script id="replay" type="application/json">/*DATA*/</script>
<script>
/*SCRIPT*/
</script>
</body>
</html>
