[project]
name = "spacetaxi"
version = "0.1.0"
description = "A multiplayer bot-arena game: bots fly taxis on a grid, pick up passengers and earn money."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
spacetaxi = "spacetaxi.cli:main"

[dependency-groups]
dev = [
    "playwright>=1.65.1",
    "pytest>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spacetaxi"]

[tool.pytest.ini_options]
testpaths = ["tests"]
